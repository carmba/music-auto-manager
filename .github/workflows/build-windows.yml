name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y

      - name: Prepare bundled FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ffmpeg_bin | Out-Null
          $ffmpeg = (Get-Command ffmpeg).Source
          $ffprobe = (Get-Command ffprobe).Source
          Copy-Item $ffmpeg "ffmpeg_bin/ffmpeg.exe" -Force
          Copy-Item $ffprobe "ffmpeg_bin/ffprobe.exe" -Force
          Get-ChildItem ffmpeg_bin

      - name: Build EXE (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller build_windows.spec

      - name: Verify build output
        shell: pwsh
        run: |
          Get-ChildItem dist
          if (!(Test-Path "dist/MusicAutoManager.exe")) {
            Write-Error "dist/MusicAutoManager.exe nao foi gerado"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicAutoManager-windows
          path: dist/MusicAutoManager.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MusicAutoManager.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
